<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FLCC – BOTR · Announcements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0D0D10;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.screen {
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  padding: 2.2vh 2.8vw 1.6vh;
  gap: 1.8vh;
}

/* ── HEADER ── */
.header {
  flex-shrink: 0;
  background: #1A1A1F;
  border-radius: 16px;
  padding: 1.6vh 2.4vw;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.07);
}
.logo {
  font-size: clamp(20px, 3vw, 54px);
  font-weight: 900; color: #F5F5F7;
  letter-spacing: -0.03em;
}
.logo-sep { color: rgba(255,255,255,0.22); margin: 0 0.3em; }
.header-label {
  font-size: clamp(10px, 1.5vw, 26px);
  font-weight: 800; color: rgba(255,255,255,0.28);
  letter-spacing: 0.2em; text-transform: uppercase;
}
.today-chip {
  display: flex; align-items: center; gap: 0.7vw;
  background: #007AFF; color: #fff;
  border-radius: 100px; padding: 0.5vh 1.4vw;
  font-size: clamp(12px, 1.8vw, 30px); font-weight: 800;
}
.today-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(255,255,255,0.8); flex-shrink: 0;
  animation: blink 2s ease-in-out infinite;
}

/* ── SCENE ── */
.scene {
  flex: 1; position: relative; min-height: 0;
  border-radius: 24px; overflow: hidden;
}

/* The two permanent layers */
.s-layer {
  position: absolute; inset: 0;
  border-radius: 24px; overflow: hidden;
}
#layer-back  { z-index: 0; }
#layer-front { z-index: 1; }

/* Crease line — always on top */
.crease {
  position: absolute; left: 0; right: 0;
  top: calc(50% - 1px); height: 2px;
  background: rgba(0,0,0,0.45);
  z-index: 200; pointer-events: none;
}

/* ── CARD BODY (rendered inside all layers) ── */
.card-body {
  position: absolute; inset: 0;
  border-radius: 24px;
  padding: 3.2vh 3.4vw 2.8vh;
  display: flex; flex-direction: column; gap: 1.8vh;
  overflow: hidden;
}
.stripe {
  position: absolute; top: 0; left: 0; right: 0;
  height: 8px; border-radius: 24px 24px 0 0;
}
.card-head {
  display: flex; align-items: center; gap: 1.4vw;
  flex-shrink: 0; padding-top: 0.6vh;
}
.cdot {
  width: clamp(16px, 2.6vh, 34px); height: clamp(16px, 2.6vh, 34px);
  border-radius: 50%; flex-shrink: 0;
}
.head-info { display: flex; flex-direction: column; gap: 0.2vh; }
.card-name {
  font-size: clamp(30px, 5.6vw, 96px);
  font-weight: 900; color: #1C1C1E;
  letter-spacing: -0.035em; line-height: 1.05;
}
.card-freq {
  font-size: clamp(14px, 2.1vw, 36px);
  font-weight: 700; color: #8E8E93; letter-spacing: -0.01em;
}
.event-list {
  flex: 1; display: flex; flex-direction: column;
  gap: 1.2vh; min-height: 0;
}
.eitem {
  flex: 1; border-radius: 14px;
  padding: 1.2vh 1.8vw;
  display: flex; flex-direction: column;
  justify-content: center; gap: 0.4vh;
  min-height: 0; overflow: hidden;
}
.eitem.dim { opacity: 0.72; }
/* single-line row: "May 29 ——— FB" */
.eitem.erow {
  flex-direction: row; align-items: center;
  justify-content: space-between; gap: 1.6vw;
}
.eitem.erow .ei-date,
.eitem.erow .ei-venue {
  font-size: clamp(18px, 3.4vw, 58px);
  line-height: 1; white-space: nowrap;
}
.ei-sep {
  flex: 1; height: 2px;
  background: rgba(255,255,255,0.28);
  border-radius: 2px; min-width: 1.5vw;
}
.ei-date {
  font-size: clamp(24px, 4.8vw, 82px);
  font-weight: 900; color: #fff;
  line-height: 1; letter-spacing: -0.025em;
}
.ei-venue {
  font-size: clamp(16px, 2.8vw, 48px);
  font-weight: 700; color: rgba(255,255,255,0.9); line-height: 1.2;
}
.meet-badge {
  display: inline-flex; align-items: center; gap: 0.5vw;
  background: rgba(255,255,255,0.2); border-radius: 100px;
  padding: 0.3vh 1vw; font-size: clamp(10px, 1.6vw, 28px);
  font-weight: 700; color: #fff; align-self: flex-start; margin-top: 0.5vh;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.9); flex-shrink: 0;
  animation: blink 1.8s ease-in-out infinite;
}

/* ── PIPS ── */
.pips {
  flex-shrink: 0; display: flex;
  justify-content: center; align-items: center; gap: 1.2vw;
}
.pip {
  width: clamp(9px, 1.4vh, 18px); height: clamp(9px, 1.4vh, 18px);
  border-radius: 50%; background: rgba(255,255,255,0.18);
  cursor: pointer; transition: background 0.3s, transform 0.3s;
}
.pip.active { background: #fff; transform: scale(1.4); }

/* ── FOOTER ── */
.footer {
  flex-shrink: 0; text-align: center;
  font-size: clamp(8px, 1vw, 16px); font-weight: 700;
  color: rgba(255,255,255,0.16); letter-spacing: 0.22em; text-transform: uppercase;
}

@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
</style>
</head>
<body>
<div class="screen">

  <header class="header">
    <div class="logo">FLCC <span class="logo-sep">—</span> BOTR</div>
    <div class="header-label">Announcements</div>
    <div class="today-chip">
      <div class="today-dot"></div>
      <span id="today-date"></span>
    </div>
  </header>

  <div class="scene" id="scene">
    <div class="s-layer" id="layer-back"></div>
    <div class="s-layer" id="layer-front"></div>
    <div class="crease"></div>
  </div>

  <div class="pips" id="pips"></div>
  <footer class="footer">FLCC – BOTR &nbsp;·&nbsp; F11 for fullscreen</footer>

</div>
<script>
(function () {

/* ═══════════════════════════
   CARD DATA
═══════════════════════════ */
var CARDS = [
  {
    accent: '#FF9500', tint: '#FFFCF2',
    title: 'Sports Activities', freq: 'Every Saturday',
    events: [
      { date: '3:15–5 PM',  venue: 'Heirs of the Kingdom' },
      { date: '5–10 PM',    venue: 'Men’s', dim: true }
    ]
  },
  {
    accent: '#007AFF', tint: '#F0F7FF',
    title: 'Intercessory Prayer', freq: 'Every Friday',
    events: [
      { date: 'May 29', venue: 'FB',         row: true },
      { date: 'Jun 5',  venue: 'GIL',        row: true, dim: true },
      { date: 'Jun 12', venue: 'Harvesters', row: true },
      { date: 'Jun 19', venue: 'JAOC',       row: true, dim: true }
    ]
  },
  {
    accent: '#AF52DE', tint: '#FAF3FF',
    title: 'Corporate Prayer Meeting', freq: '',
    events: [
      { date: 'Jun 10', venue: 'Faithful & True' }
    ]
  },
  {
    accent: '#34C759', tint: '#F0FFF4',
    title: 'Men’s Virtual Bible Study', freq: 'Every Wednesday',
    events: [
      { date: '8:30 PM', venue: 'Google Meet', badge: true }
    ]
  }
];

/* ═══════════════════════════
   RENDER
═══════════════════════════ */
function renderCard(c) {
  var evs = c.events.map(function(e) {
    var cls = 'eitem' + (e.row ? ' erow' : '') + (e.dim ? ' dim' : '');
    var body = e.row
      ? '<span class="ei-date">' + e.date + '</span>' +
        '<span class="ei-sep"></span>' +
        '<span class="ei-venue">' + e.venue + '</span>'
      : '<div class="ei-date">' + e.date + '</div>' +
        '<div class="ei-venue">' + e.venue + '</div>' +
        (e.badge ? '<div class="meet-badge"><div class="live-dot"></div> Live Online</div>' : '');
    return '<div class="' + cls + '" style="background:' + c.accent + '">' + body + '</div>';
  }).join('');

  return '<div class="card-body" style="background:' + c.tint + '">' +
    '<div class="stripe" style="background:' + c.accent + '"></div>' +
    '<div class="card-head">' +
      '<div class="cdot" style="background:' + c.accent + '"></div>' +
      '<div class="head-info">' +
        '<div class="card-name">' + c.title + '</div>' +
        (c.freq ? '<div class="card-freq">' + c.freq + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="event-list">' + evs + '</div>' +
  '</div>';
}

/* ═══════════════════════════
   FLAP FACTORY
   Creates a temporary half-panel that rotates in or out.

   half        'top' | 'bot'
   cardObj     card data to render inside
   fromAngle   starting rotateX (degrees)
   toAngle     ending   rotateX (degrees)
   dur         animation duration (ms)
   ease        CSS easing string
   delay       CSS transition delay (ms)
   zIdx        CSS z-index
═══════════════════════════ */
function makeFlap(half, cardObj, fromAngle, toAngle, dur, ease, delay, zIdx) {
  var isTop = half === 'top';

  /* Clipping container */
  var wrap = document.createElement('div');
  wrap.style.cssText = [
    'position:absolute',
    'left:0', 'right:0',
    isTop ? 'top:0' : 'bottom:0',
    'height:50%',
    'overflow:hidden',
    /* perspective here — each container is its own 3-D stage so that
       overflow:hidden clips in 2-D AFTER the 3-D projection,
       giving true perspective without flattening the rotation */
    'perspective:1800px',
    'perspective-origin:50% ' + (isTop ? '100%' : '0%'),
    'z-index:' + zIdx,
    'pointer-events:none',
    'border-radius:' + (isTop ? '24px 24px 0 0' : '0 0 24px 24px')
  ].join(';');

  /* Rotating inner — 200% height so the full card renders;
     overflow on the parent shows only the relevant half */
  var inner = document.createElement('div');
  inner.style.cssText = [
    'position:absolute',
    'left:0', 'right:0',
    isTop ? 'top:0' : 'bottom:0',
    'height:200%',
    'transform-origin:50% ' + (isTop ? '100%' : '0%'),
    'transform:rotateX(' + fromAngle + 'deg)',
    'border-radius:inherit',
    'backface-visibility:hidden',
    '-webkit-backface-visibility:hidden'
  ].join(';');

  inner.innerHTML = renderCard(cardObj);
  wrap.appendChild(inner);
  document.getElementById('scene').appendChild(wrap);

  /* Trigger animation on next two frames so the browser
     registers the start transform before transitioning */
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      inner.style.transition =
        'transform ' + dur + 'ms ' + ease + ' ' + delay + 'ms';
      inner.style.transform = 'rotateX(' + toAngle + 'deg)';
    });
  });

  return wrap;
}

/* ═══════════════════════════
   STATE
═══════════════════════════ */
var TOTAL    = CARDS.length;
var TICK_MS  = 7000;   /* 7 s between flips          */
var FLIP_MS  = 620;    /* total flip anim duration    */

var current  = 0;
var animating = false;
var timer;

var layerFront = document.getElementById('layer-front');
var layerBack  = document.getElementById('layer-back');

/* ═══════════════════════════
   PIPS
═══════════════════════════ */
var pipsEl = document.getElementById('pips');
CARDS.forEach(function(_, i) {
  var p = document.createElement('div');
  p.className = 'pip' + (i === 0 ? ' active' : '');
  p.addEventListener('click', function() { manualGoTo(i); });
  pipsEl.appendChild(p);
});

function updatePips(idx) {
  [].forEach.call(pipsEl.querySelectorAll('.pip'), function(p, i) {
    p.classList.toggle('active', i === idx);
  });
}

/* ═══════════════════════════
   INIT
═══════════════════════════ */
function init() {
  layerFront.innerHTML = renderCard(CARDS[0]);
  layerBack.innerHTML  = renderCard(CARDS[1 % TOTAL]);
  updatePips(0);
}

/* ═══════════════════════════
   TRANSITION  — the Solari split-flap sequence

   Phase A  OLD card top folds DOWN  (rotateX 0 → +90°)
   Phase A  OLD card bot folds UP    (rotateX 0 → -90°)  80 ms later
   Phase B  NEW card top unfolds in  (rotateX -90 → 0°)  250 ms after A-top starts
   Phase B  NEW card bot unfolds in  (rotateX +90 → 0°)  330 ms after A-top starts
═══════════════════════════ */
function goTo(next) {
  if (animating || next === current) return;
  animating = true;

  var prev = current;
  current  = next;
  updatePips(next);

  /* Hide the static front layer — the old-top/bot overlays (starting at 0°)
     look identical to it, so the transition is seamless */
  layerFront.style.visibility = 'hidden';

  /* Phase A: fold the old card's two halves away */
  var oldTop = makeFlap('top', CARDS[prev],  0,  90, 260, 'ease-in',   0, 30);
  var oldBot = makeFlap('bot', CARDS[prev],  0, -90, 260, 'ease-in',  80, 29);

  /* Phase B: unfold the new card's two halves in
     (new-top starts behind the screen at -90°, swings to flat 0°) */
  var newTop = makeFlap('top', CARDS[next], -90,  0, 260, 'ease-out', 260, 28);
  var newBot = makeFlap('bot', CARDS[next],  90,  0, 260, 'ease-out', 340, 27);

  /* After all flaps finish, retire overlays and restore the static layers */
  setTimeout(function() {
    oldTop.remove(); oldBot.remove();
    newTop.remove(); newBot.remove();

    layerFront.innerHTML    = renderCard(CARDS[next]);
    layerFront.style.visibility = 'visible';
    layerBack.innerHTML     = renderCard(CARDS[(next + 1) % TOTAL]);

    animating = false;
  }, FLIP_MS);
}

/* ═══════════════════════════
   TIMER
═══════════════════════════ */
function advance()    { goTo((current + 1) % TOTAL); }
function startTimer() { timer = setInterval(advance, TICK_MS); }
function resetTimer() { clearInterval(timer); startTimer(); }

function manualGoTo(idx) { goTo(idx); resetTimer(); }

/* ═══════════════════════════
   INPUT — swipe, drag, keyboard
═══════════════════════════ */
var dragX = null;
document.addEventListener('touchstart', function(e) { dragX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend',   function(e) {
  if (dragX === null) return;
  var dx = e.changedTouches[0].clientX - dragX; dragX = null;
  if (Math.abs(dx) < 50) return;
  manualGoTo(dx < 0 ? (current + 1) % TOTAL : (current - 1 + TOTAL) % TOTAL);
});
document.addEventListener('mousedown', function(e) { dragX = e.clientX; });
document.addEventListener('mouseup',   function(e) {
  if (dragX === null) return;
  var dx = e.clientX - dragX; dragX = null;
  if (Math.abs(dx) < 50) return;
  manualGoTo(dx < 0 ? (current + 1) % TOTAL : (current - 1 + TOTAL) % TOTAL);
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') manualGoTo((current + 1) % TOTAL);
  if (e.key === 'ArrowLeft')  manualGoTo((current - 1 + TOTAL) % TOTAL);
});

/* ═══════════════════════════
   FRIDAY DATE
═══════════════════════════ */
(function() {
  var now  = new Date();
  var diff = (5 - now.getDay() + 7) % 7;
  var fri  = new Date(now);
  fri.setDate(now.getDate() + diff);
  document.getElementById('today-date').textContent =
    fri.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
}());

/* ═══════════════════════════
   BOOT
═══════════════════════════ */
init();
startTimer();

}());
</script>
</body>
</html>
