<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FLCC – BOTR · Announcements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF9500;
  --blue:   #007AFF;
  --purple: #AF52DE;
  --green:  #34C759;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111114;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── SCREEN SHELL ── */
.screen {
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  padding: 2.2vh 2.8vw 1.6vh;
  gap: 1.8vh;
}

/* ── HEADER ── */
.header {
  flex-shrink: 0;
  background: #1E1E22;
  border-radius: 16px;
  padding: 1.6vh 2.4vw;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 2px 16px rgba(0,0,0,0.4);
}

.logo {
  font-size: clamp(20px, 3vw, 54px);
  font-weight: 900;
  color: #F5F5F7;
  letter-spacing: -0.03em;
}
.logo-sep { color: rgba(255,255,255,0.25); font-weight: 700; margin: 0 0.3em; }

.header-label {
  font-size: clamp(10px, 1.5vw, 26px);
  font-weight: 800;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.today-chip {
  display: flex; align-items: center; gap: 0.7vw;
  background: var(--blue); color: #fff;
  border-radius: 100px;
  padding: 0.55vh 1.4vw;
  font-size: clamp(12px, 1.7vw, 30px);
  font-weight: 800;
}
.today-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  flex-shrink: 0;
  animation: blink 2s ease-in-out infinite;
}

/* ═══════════════════════════════════════
   FLIP BOARD SCENE
   ─────────────────────────────────────
   Layout (z-order, bottom → top):
     1. scene-back  — incoming card, always fully rendered beneath
     2. flap-bot    — bottom half of the CURRENT card (flips upward)
     3. flap-top    — top half of the CURRENT card (flips downward)
     4. flap-crease — thin dark line at the midpoint (decorative)
   ═══════════════════════════════════════ */
.scene {
  flex: 1;
  position: relative;
  min-height: 0;
}

/* BACK — incoming card sits here, revealed as flaps fold away */
.scene-back {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  overflow: hidden;
  z-index: 1;
}

/*
 * TOP FLAP
 * Clips to the top 50% of the scene via overflow:hidden.
 * The inner is 200% tall (= full scene height) so the card
 * renders completely — only the top half is visible.
 * Pivot: bottom edge of the flap (= the center crease line).
 * Rotation: 0 → -90° (folds DOWN toward the viewer).
 */
.flap-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  overflow: hidden;
  z-index: 3;
  /* perspective here so overflow:hidden doesn't flatten it */
  perspective: 2800px;
  perspective-origin: 50% 100%;   /* eye is at the crease */
}
.flap-top-inner {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 200%;
  transform-origin: 50% 100%;     /* pivot at bottom (crease) */
  border-radius: 24px 24px 0 0;
  backface-visibility: hidden;
}

/*
 * BOTTOM FLAP
 * Clips to the bottom 50%.
 * Inner is 200% tall with bottom:0 so the same full card renders,
 * and only the bottom half is visible.
 * Pivot: top edge of the flap (= the center crease line).
 * Rotation: 0 → 90° (folds UP toward the viewer).
 */
.flap-bot {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50%;
  overflow: hidden;
  z-index: 2;
  perspective: 2800px;
  perspective-origin: 50% 0%;    /* eye is at the crease */
}
.flap-bot-inner {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 200%;
  transform-origin: 50% 0%;      /* pivot at top (crease) */
  border-radius: 0 0 24px 24px;
  backface-visibility: hidden;
}

/* Thin dark crease — the mechanical split line */
.flap-crease {
  position: absolute;
  left: 0; right: 0;
  top: calc(50% - 1px);
  height: 2px;
  background: rgba(0,0,0,0.35);
  z-index: 10;
  pointer-events: none;
}

/* ── FLIP ANIMATIONS ── */
@keyframes foldTopDown {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); }
}
@keyframes foldBotUp {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(90deg); }
}

.flap-top-inner.flipping {
  animation: foldTopDown 0.42s cubic-bezier(0.55, 0, 1, 0.45) forwards;
}
.flap-bot-inner.flipping {
  animation: foldBotUp  0.42s cubic-bezier(0.55, 0, 1, 0.45) forwards;
}

/* ── CARD BODY (rendered inside every flap and back panel) ── */
.card-body {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  padding: 3.2vh 3.2vw 2.6vh;
  display: flex; flex-direction: column;
  gap: 1.8vh;
  overflow: hidden;
}

/* Top accent stripe */
.stripe {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  border-radius: 24px 24px 0 0;
}

/* Card header row */
.card-head {
  display: flex; align-items: center;
  gap: 1.3vw;
  flex-shrink: 0;
  padding-top: 0.6vh;
}

.cdot {
  width: clamp(16px, 2.4vh, 32px);
  height: clamp(16px, 2.4vh, 32px);
  border-radius: 50%;
  flex-shrink: 0;
}

.head-info { display: flex; flex-direction: column; gap: 0.2vh; min-width: 0; }

.card-name {
  font-size: clamp(30px, 5.4vw, 92px);
  font-weight: 900;
  color: #1C1C1E;
  letter-spacing: -0.035em;
  line-height: 1.05;
}
.card-freq {
  font-size: clamp(14px, 2vw, 34px);
  font-weight: 700;
  color: #8E8E93;
  letter-spacing: -0.01em;
}

/* Event list */
.event-list {
  flex: 1;
  display: flex; flex-direction: column;
  gap: 1.2vh;
  min-height: 0;
}

.eitem {
  flex: 1;
  border-radius: 14px;
  padding: 1.2vh 1.8vw;
  display: flex; flex-direction: column;
  justify-content: center;
  gap: 0.4vh;
  min-height: 0; overflow: hidden;
}
.eitem.dim { opacity: 0.72; }

/* Single-line row for Intercessory Prayer: date ——— venue */
.eitem.erow {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 1.6vw;
}
.eitem.erow .ei-date,
.eitem.erow .ei-venue {
  font-size: clamp(18px, 3.4vw, 56px);
  line-height: 1;
  white-space: nowrap;
}
.eitem.erow .ei-sep {
  flex: 1;
  height: 2px;
  background: rgba(255,255,255,0.28);
  border-radius: 2px;
  min-width: 1.5vw;
}

.ei-date {
  font-size: clamp(24px, 4.6vw, 78px);
  font-weight: 900;
  color: #fff;
  line-height: 1;
  letter-spacing: -0.025em;
}
.ei-venue {
  font-size: clamp(16px, 2.6vw, 44px);
  font-weight: 700;
  color: rgba(255,255,255,0.88);
  line-height: 1.2;
}

/* Google Meet live badge */
.meet-badge {
  display: inline-flex; align-items: center; gap: 0.5vw;
  background: rgba(255,255,255,0.2);
  border-radius: 100px;
  padding: 0.3vh 1vw;
  font-size: clamp(10px, 1.6vw, 26px);
  font-weight: 700;
  color: #fff;
  align-self: flex-start;
  margin-top: 0.5vh;
}
.live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  flex-shrink: 0;
  animation: blink 1.8s ease-in-out infinite;
}

/* ── PIPS ── */
.deck-pips {
  flex-shrink: 0;
  display: flex; justify-content: center; align-items: center;
  gap: 1.2vw;
}
.pip {
  width: clamp(9px, 1.4vh, 18px);
  height: clamp(9px, 1.4vh, 18px);
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  cursor: pointer;
  transition: background 0.35s, transform 0.35s;
}
.pip.active {
  background: #fff;
  transform: scale(1.4);
}

/* ── FOOTER ── */
.footer {
  flex-shrink: 0;
  text-align: center;
  font-size: clamp(8px, 1vw, 16px);
  font-weight: 700;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.2; }
}
</style>
</head>
<body>
<div class="screen">

  <header class="header">
    <div class="logo">FLCC <span class="logo-sep">—</span> BOTR</div>
    <div class="header-label">Announcements</div>
    <div class="today-chip">
      <div class="today-dot"></div>
      <span id="today-date"></span>
    </div>
  </header>

  <div class="scene" id="scene">
    <!-- Incoming card — always fully rendered, revealed as flaps fold away -->
    <div class="scene-back" id="scene-back"></div>

    <!-- Bottom flap (z:2) — folds upward -->
    <div class="flap-bot" id="flap-bot">
      <div class="flap-bot-inner" id="fbi"></div>
    </div>

    <!-- Top flap (z:3) — folds downward, in front of bottom flap -->
    <div class="flap-top" id="flap-top">
      <div class="flap-top-inner" id="fti"></div>
    </div>

    <!-- Decorative crease line at the split point -->
    <div class="flap-crease"></div>
  </div>

  <div class="deck-pips" id="deckPips"></div>
  <footer class="footer">FLCC – BOTR &nbsp;·&nbsp; F11 for fullscreen</footer>

</div><!-- /screen -->

<script>
(function () {

/* ════════════════════════════════════
   CARD DATA
   ════════════════════════════════════ */
const CARDS = [
  {
    accent: '#FF9500',
    tint:   '#FFFCF2',
    title:  'Sports Activities',
    freq:   'Every Saturday',
    events: [
      { date: '3:15 – 5 PM', venue: 'Heirs of the Kingdom' },
      { date: '5 – 10 PM',   venue: 'Men’s', dim: true },
    ]
  },
  {
    accent: '#007AFF',
    tint:   '#F0F7FF',
    title:  'Intercessory Prayer',
    freq:   'Every Friday',
    events: [
      { date: 'May 29', venue: 'FB',         row: true },
      { date: 'Jun 5',  venue: 'GIL',        row: true, dim: true },
      { date: 'Jun 12', venue: 'Harvesters', row: true },
      { date: 'Jun 19', venue: 'JAOC',       row: true, dim: true },
    ]
  },
  {
    accent: '#AF52DE',
    tint:   '#FAF3FF',
    title:  'Corporate Prayer Meeting',
    freq:   '',
    events: [
      { date: 'Jun 10', venue: 'Faithful & True' },
    ]
  },
  {
    accent: '#34C759',
    tint:   '#F0FFF4',
    title:  'Men’s Virtual Bible Study',
    freq:   'Every Wednesday',
    events: [
      { date: '8:30 PM', venue: 'Google Meet', badge: true },
    ]
  },
];

/* ════════════════════════════════════
   HTML RENDERER
   ════════════════════════════════════ */
function renderCard(c) {
  const events = c.events.map(e => {
    const cls = 'eitem' +
      (e.row  ? ' erow' : '') +
      (e.dim  ? ' dim'  : '');

    const inner = e.row
      ? `<span class="ei-date">${e.date}</span>
         <span class="ei-sep"></span>
         <span class="ei-venue">${e.venue}</span>`
      : `<div class="ei-date">${e.date}</div>
         <div class="ei-venue">${e.venue}</div>` +
        (e.badge
          ? `<div class="meet-badge"><div class="live-dot"></div> Live Online</div>`
          : '');

    return `<div class="${cls}" style="background:${c.accent}">${inner}</div>`;
  }).join('');

  return `
    <div class="card-body" style="background:${c.tint}">
      <div class="stripe" style="background:${c.accent}"></div>
      <div class="card-head">
        <div class="cdot" style="background:${c.accent}"></div>
        <div class="head-info">
          <div class="card-name">${c.title}</div>
          ${c.freq ? `<div class="card-freq">${c.freq}</div>` : ''}
        </div>
      </div>
      <div class="event-list">${events}</div>
    </div>`;
}

/* ════════════════════════════════════
   STATE
   ════════════════════════════════════ */
const TOTAL   = CARDS.length;
const TICK_MS = 7000;     // 7 s between flips
const TOP_MS  = 420;      // top-flap fold duration (ms) — matches CSS
const BOT_DLY = 110;      // ms after top starts that bottom begins
const BOT_MS  = 420;      // bottom-flap fold duration (ms)
const DONE_MS = BOT_DLY + BOT_MS + 30; // total flip time + small buffer

let current   = 0;
let animating = false;
let timer;

const sceneBack = document.getElementById('scene-back');
const fti       = document.getElementById('fti');   // flap-top-inner
const fbi       = document.getElementById('fbi');   // flap-bot-inner
const pipsEl    = document.getElementById('deckPips');

/* ════════════════════════════════════
   PIPS
   ════════════════════════════════════ */
CARDS.forEach((_, i) => {
  const p = document.createElement('div');
  p.className = 'pip' + (i === 0 ? ' active' : '');
  p.addEventListener('click', () => manualGoTo(i));
  pipsEl.appendChild(p);
});

function updatePips(idx) {
  pipsEl.querySelectorAll('.pip').forEach((p, i) =>
    p.classList.toggle('active', i === idx));
}

/* ════════════════════════════════════
   INIT
   — Flaps show card[0] (current)
   — Back shows card[1] (upcoming)
   ════════════════════════════════════ */
function init() {
  fti.innerHTML = renderCard(CARDS[0]);
  fbi.innerHTML = renderCard(CARDS[0]);
  sceneBack.innerHTML = renderCard(CARDS[1 % TOTAL]);
  updatePips(0);
}

/* ════════════════════════════════════
   TRANSITION
   ════════════════════════════════════ */
function goTo(next) {
  if (animating || next === current) return;
  animating = true;

  current = next;
  updatePips(next);

  /*
   * scene-back already holds `next` (preloaded at end of last transition).
   * Fold the top flap down first, then the bottom flap up shortly after.
   * Both reveal the back layer underneath.
   */

  /* Ensure no stale animation class */
  fti.classList.remove('flipping');
  fbi.classList.remove('flipping');
  void fti.offsetWidth; /* force reflow so removal is committed */

  fti.classList.add('flipping');

  setTimeout(() => {
    fbi.classList.add('flipping');
  }, BOT_DLY);

  /*
   * After both flaps have fully folded (= both invisible):
   *   1. Snap flaps to show the new current card (no animation).
   *   2. Remove the flipping class so they're flat again.
   *   3. Preload the NEXT upcoming card into scene-back.
   */
  setTimeout(() => {
    fti.classList.remove('flipping');
    fbi.classList.remove('flipping');

    fti.innerHTML = renderCard(CARDS[next]);
    fbi.innerHTML = renderCard(CARDS[next]);

    sceneBack.innerHTML = renderCard(CARDS[(next + 1) % TOTAL]);

    animating = false;
  }, DONE_MS);
}

/* ════════════════════════════════════
   TIMER
   ════════════════════════════════════ */
function advance()    { goTo((current + 1) % TOTAL); }
function startTimer() { timer = setInterval(advance, TICK_MS); }
function resetTimer() { clearInterval(timer); startTimer(); }

function manualGoTo(idx) {
  goTo(idx);
  resetTimer();
}

/* ════════════════════════════════════
   INPUT — touch, mouse drag, keyboard
   ════════════════════════════════════ */
let dragX = null;

document.addEventListener('touchstart', e => { dragX = e.touches[0].clientX; },  { passive: true });
document.addEventListener('touchend',   e => {
  if (dragX === null) return;
  const dx = e.changedTouches[0].clientX - dragX;
  dragX = null;
  if (Math.abs(dx) < 50) return;
  manualGoTo(dx < 0 ? (current + 1) % TOTAL : (current - 1 + TOTAL) % TOTAL);
});

document.addEventListener('mousedown', e => { dragX = e.clientX; });
document.addEventListener('mouseup',   e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  dragX = null;
  if (Math.abs(dx) < 50) return;
  manualGoTo(dx < 0 ? (current + 1) % TOTAL : (current - 1 + TOTAL) % TOTAL);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') manualGoTo((current + 1) % TOTAL);
  if (e.key === 'ArrowLeft')  manualGoTo((current - 1 + TOTAL) % TOTAL);
});

/* ════════════════════════════════════
   DYNAMIC FRIDAY DATE
   Shows the current or next upcoming Friday
   ════════════════════════════════════ */
(function () {
  const now  = new Date();
  const diff = (5 - now.getDay() + 7) % 7;   /* 0 if today is Friday */
  const fri  = new Date(now);
  fri.setDate(now.getDate() + diff);
  document.getElementById('today-date').textContent =
    fri.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}());

/* ════════════════════════════════════
   BOOT
   ════════════════════════════════════ */
init();
startTimer();

}());
</script>
</body>
</html>
